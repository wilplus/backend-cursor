# God-file split: routes/v2/user_chat.py carries interview-question code that
# was parked above while it lived in routes/v2_routes.py — same lines, same
# park. The other routes/v2/* domain modules type-check clean (ratchet held).
# Same story for routes/v2/admin.py: the one error it reports was parked
# under routes.v2_routes before the split moved these lines verbatim.
[mypy-routes.v2.user_chat,routes.v2.admin]
