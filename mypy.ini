# Type-check gate — runs in CI (.github/workflows/tests.yml, "lint" job) and
# locally via `mypy .`.
#
# This is a RATCHET, not a finish line. The gate checks the whole production
# surface (app, auth, config, worker, routes, services, utils, scripts) with
# default — lenient — mypy. Modules that were already red when the gate was
# introduced are parked below under ignore_errors so the gate is green from
# day 1 and means something. The deal:
#
#   * every module NOT listed below is type-checked on every push — new type
#     errors in clean modules (all of routes/ except v2_routes, auth.py,
#     app.py, config.py, most of services/) block the merge;
#   * entries below may only ever be REMOVED (clean a module → delete its
#     line → it gates forever after). Never add a module to this list.
#
# Test files are excluded: the unittest modules' try/except import-guard
# idiom (`Flask = None` on ImportError) is a deliberate skip mechanism and
# would drown the signal in ~260 false positives.

[mypy]
python_version = 3.12
ignore_missing_imports = True
exclude = (?x)(
    (^|/)test_[^/]*\.py$
    | ^tests/
  )

# ---- Legacy debt, parked at gate-introduction (error count at the time) ----

# services/db.py (90) — the 15k-line God module; biggest single chunk of debt.
[mypy-services.db]
ignore_errors = True

# 10-29 errors each.
[mypy-services.tier_checkout,services.lab_recording,services.life_import,services.casual_voice_analytics,services.take_comparison]
