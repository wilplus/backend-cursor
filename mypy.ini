# 2-8 errors each.
[mypy-services.user_audit,services.openai_service,services.session_metrics,services.life_reminders,services.best_presentation,services.snippet_labels,services.life_engine,services.training_import,services.master_document,services.slide_word_split,services.learning_trace,services.dev_tasks,services.tutor_video_url,services.session_publish,services.session_cadence,services.prior_take_changes,services.llm_pricing,services.life_panel,services.learning_export,services.audio_metrics]
ignore_errors = True

# 1 error each.
[mypy-services.stripe_checkout_credits,services.stress_snippet_service,services.stickiness,services.moment_suggestions,services.job_queue,services.feeling_performance,services.email_service,services.dev_bugs,services.community_content,services.coach_comment_drafter,services.charisma_snippet_service,services.auto_comment,services.arc_checkout]
