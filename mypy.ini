# scripts/ (not a package — top-level module names). Operational one-offs;
# 1-8 errors each.
[mypy-smoke_rlhf_capture,train_stress_classifier_baseline,render_doc_pdf,phase_a0_diagnostics,mint_arc_invite_codes,export_stress_snippets_dataset,backfill_trial_session_publish,backfill_snippet_transcripts,backfill_sniper_metrics]
