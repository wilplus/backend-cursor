<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Snippet Labeler</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; line-height: 1.4; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .muted { color: #888; font-size: 12px; }
  textarea, input[type=text] { width: 100%; font-family: inherit; font-size: 14px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  textarea { min-height: 60px; }
  button { font-size: 14px; padding: 8px 14px; border: 1px solid #888; background: #f5f5f5; border-radius: 6px; cursor: pointer; }
  button:hover { background: #e8e8e8; }
  button.active { background: #2563eb; color: white; border-color: #2563eb; }
  button.danger { background: #fee; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
  .axis { display: flex; gap: 8px; align-items: center; }
  .axis-label { width: 80px; font-weight: 600; }
  audio { width: 100%; margin: 8px 0; }
  .kbd { display: inline-block; padding: 1px 6px; border: 1px solid #888; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 11px; background: #f0f0f0; color: #333; }
  .stats { font-variant-numeric: tabular-nums; font-size: 13px; color: #555; }
  .err { color: #b00020; font-size: 13px; min-height: 18px; }
  .ok { color: #0a7d3b; font-size: 13px; min-height: 18px; }
  details summary { cursor: pointer; font-size: 13px; color: #555; }
  .transcript { line-height: 1.7; font-size: 14px; }
  .transcript .word {
    display: inline-block;
    padding: 1px 4px;
    margin: 1px 1px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.08s;
  }
  .transcript .word:hover { background: #e0e7ff; }
  .transcript .word.active { background: #2563eb; color: white; }
  .lang-badge {
    display: inline-block;
    padding: 1px 6px;
    margin-left: 6px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    background: #eef; color: #335;
    border-radius: 4px;
  }
</style>
</head>
<body>

<h1>Snippet Labeler</h1>

<details open id="auth-block">
  <summary>Auth (paste your admin JWT once; saved to localStorage)</summary>
  <div class="row">
    <input type="text" id="token" placeholder="Bearer token (no 'Bearer ' prefix)" />
  </div>
  <div class="row">
    <button id="save-token">Save token</button>
    <button id="clear-token" class="danger">Clear</button>
    <span class="muted" id="token-state"></span>
  </div>
</details>

<div class="stats" id="stats">labels: — | total: — | snippets: —</div>

<div class="card" id="card" style="display:none">
  <div class="row muted" id="meta"></div>
  <audio id="audio" controls preload="auto"></audio>
  <div class="transcript" id="transcript"></div>

  <div class="axis">
    <span class="axis-label">Charisma</span>
    <button data-axis="charisma" data-val="0">0 <span class="kbd">q</span></button>
    <button data-axis="charisma" data-val="1">1 <span class="kbd">w</span></button>
    <button data-axis="charisma" data-val="null" class="danger">clear</button>
  </div>
  <div class="axis">
    <span class="axis-label">Stress</span>
    <button data-axis="stress" data-val="0">0 <span class="kbd">a</span></button>
    <button data-axis="stress" data-val="1">1 <span class="kbd">s</span></button>
    <button data-axis="stress" data-val="null" class="danger">clear</button>
  </div>
  <div class="axis">
    <span class="axis-label">Confidence</span>
    <button data-conf="high" class="active">High <span class="kbd">r</span></button>
    <button data-conf="low">Low <span class="kbd">e</span></button>
    <span class="muted">borderline = low</span>
  </div>

  <div class="row"><textarea id="notes" placeholder="notes (optional)"></textarea></div>

  <div class="row">
    <button id="submit"><b>Submit</b> <span class="kbd">Enter</span></button>
    <button id="skip">Skip <span class="kbd">Esc</span></button>
    <span class="ok" id="ok"></span>
    <span class="err" id="err"></span>
  </div>
</div>

<div id="empty" style="display:none" class="muted">No more unlabeled snippets in the queue.</div>

<script>
  const BACKEND = window.location.origin;
  const $ = (id) => document.getElementById(id);
  let token = localStorage.getItem("snippet_labeler_token") || "";
  let current = null;       // current snippet
  let charisma = null;      // 0 | 1 | null
  let stress = null;        // 0 | 1 | null
  let confidence = "high";  // 'low' | 'high' (default high)

  function setTokenStateMsg() {
    $("token-state").textContent = token ? "token loaded" : "no token";
    if (token) $("auth-block").open = false;
  }
  $("token").value = token;
  setTokenStateMsg();

  $("save-token").addEventListener("click", () => {
    token = $("token").value.trim();
    localStorage.setItem("snippet_labeler_token", token);
    setTokenStateMsg();
    refresh();
  });
  $("clear-token").addEventListener("click", () => {
    token = "";
    localStorage.removeItem("snippet_labeler_token");
    $("token").value = "";
    setTokenStateMsg();
  });

  async function api(method, path, body) {
    const headers = { "Content-Type": "application/json" };
    if (token) headers["Authorization"] = "Bearer " + token;
    const res = await fetch(BACKEND + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const text = await res.text();
    let json = null;
    try { json = text ? JSON.parse(text) : null; } catch { json = { raw: text }; }
    if (!res.ok) {
      const err = (json && (json.error || json.code)) || res.statusText;
      throw new Error(`${res.status}: ${err}`);
    }
    return json;
  }

  function setActive(axis, val) {
    document.querySelectorAll(`button[data-axis="${axis}"]`).forEach(b => b.classList.remove("active"));
    if (val !== null) {
      const btn = document.querySelector(`button[data-axis="${axis}"][data-val="${val}"]`);
      if (btn) btn.classList.add("active");
    }
  }

  function pickAxis(axis, raw) {
    const val = raw === "null" ? null : parseInt(raw, 10);
    if (axis === "charisma") { charisma = val; setActive("charisma", val === null ? null : val); }
    else                     { stress = val;   setActive("stress",   val === null ? null : val); }
  }

  document.querySelectorAll("button[data-axis]").forEach(btn => {
    btn.addEventListener("click", () => pickAxis(btn.dataset.axis, btn.dataset.val));
  });

  function setConfidence(c) {
    confidence = c;
    document.querySelectorAll("button[data-conf]").forEach(b => b.classList.remove("active"));
    const btn = document.querySelector(`button[data-conf="${c}"]`);
    if (btn) btn.classList.add("active");
  }
  document.querySelectorAll("button[data-conf]").forEach(btn => {
    btn.addEventListener("click", () => setConfidence(btn.dataset.conf));
  });

  function clearMessage() { $("err").textContent = ""; $("ok").textContent = ""; }

  function renderTranscript(snippet) {
    const container = $("transcript");
    container.innerHTML = "";
    const words = Array.isArray(snippet.words) ? snippet.words : null;
    if (words && words.length > 0) {
      // Word-level scrubbing: click any word to seek the audio element.
      words.forEach((w, i) => {
        const span = document.createElement("span");
        span.className = "word";
        span.dataset.idx = i;
        span.dataset.start = (w.start ?? 0).toString();
        span.dataset.end = (w.end ?? 0).toString();
        span.textContent = (w.word || "").trim() || " ";
        span.addEventListener("click", () => {
          const audio = $("audio");
          audio.currentTime = parseFloat(span.dataset.start) || 0;
          audio.play().catch(() => { /* autoplay-blocked; user already clicked, but ignore */ });
        });
        container.appendChild(span);
        container.appendChild(document.createTextNode(" "));
      });
    } else {
      // No word-level data yet (older snippet, not backfilled). Fall back to plain text.
      const fallback = snippet.transcript || snippet.transcript_excerpt || "(no transcript)";
      container.textContent = fallback;
    }
  }

  // Highlight the active word as audio plays.
  $("audio").addEventListener("timeupdate", () => {
    const t = $("audio").currentTime;
    let active = null;
    document.querySelectorAll("#transcript .word").forEach(span => {
      const s = parseFloat(span.dataset.start);
      const e = parseFloat(span.dataset.end);
      const hit = (t >= s) && (t < e + 0.02);
      if (hit) active = span;
      span.classList.toggle("active", hit);
    });
    if (active) {
      // Keep the active word in view if the transcript ever scrolls (rare on short clips).
      active.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
    }
  });

  async function refresh() {
    clearMessage();
    if (!token) { $("err").textContent = "Paste a token first."; return; }
    try {
      const s = await api("GET", "/admin/snippet-labels/stats");
      $("stats").textContent = `labels by me: ${s.labels_by_me} (high ${s.labels_by_me_high}, low ${s.labels_by_me_low}) | total: ${s.labels_total} | snippets in pool: ${s.snippets_total}`;
      const data = await api("GET", "/admin/snippet-labels/next?limit=1");
      if (!data.snippets || data.snippets.length === 0) {
        $("card").style.display = "none";
        $("empty").style.display = "block";
        current = null;
        return;
      }
      current = data.snippets[0];
      charisma = null; stress = null;
      setActive("charisma", null); setActive("stress", null);
      setConfidence("high");  // reset to default each snippet
      $("notes").value = "";
      $("audio").src = current.audio_url;
      const langBadge = current.language ? `<span class="lang-badge">${current.language}</span>` : "";
      $("meta").innerHTML = `${current.source_type || "?"} · ${current.scenario || "?"} · ${current.duration_ms || "?"}ms · p(stress)=${current.classifier_stress_probability ?? "—"} · id=${current.snippet_id}${langBadge}`;
      renderTranscript(current);
      $("card").style.display = "block";
      $("empty").style.display = "none";
    } catch (e) {
      $("err").textContent = e.message;
    }
  }

  async function submit() {
    clearMessage();
    if (!current) return;
    if (charisma === null && stress === null) {
      $("err").textContent = "Pick at least one axis (q/w/a/s).";
      return;
    }
    try {
      await api("POST", "/admin/snippet-labels/submit", {
        snippet_id: current.snippet_id,
        charisma, stress, confidence,
        notes: $("notes").value || null,
      });
      $("ok").textContent = "saved";
      refresh();
    } catch (e) {
      $("err").textContent = e.message;
    }
  }

  $("submit").addEventListener("click", submit);
  $("skip").addEventListener("click", () => {
    // "Skip" just refreshes — does NOT label as null; UPSERT requires at least one axis.
    // To exclude a snippet, label it 0 on both axes.
    refresh();
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
    if (e.key === "q") pickAxis("charisma", "0");
    else if (e.key === "w") pickAxis("charisma", "1");
    else if (e.key === "a") pickAxis("stress", "0");
    else if (e.key === "s") pickAxis("stress", "1");
    else if (e.key === "r") setConfidence("high");
    else if (e.key === "e") setConfidence("low");
    else if (e.key === "Enter") submit();
    else if (e.key === "Escape") refresh();
  });

  refresh();
</script>

</body>
</html>
