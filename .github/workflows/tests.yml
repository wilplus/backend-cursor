name: tests

# Regression gate for the Python test suite. Runs the unit-tier
# tests on every push + PR. Integration-tier modules that need live
# Supabase / network credentials are quarantined (see QUARANTINE
# below) — they can't run in CI without secrets and would be red
# for environmental reasons, not real bugs. A red-on-day-1 gate
# gets ignored; this one stays green so it means something.
#
# When the quarantined modules get proper setUpModule/tearDownModule
# stubbing (per the memory note on test-stub isolation), move them
# out of the ignore list so CI covers them too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger — run the suite + the master-doc probe on demand from
  # the Actions tab (e.g. to capture the probe baseline on main right
  # after adding the OPENAI_API_KEY secret, without a dummy push).
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.1"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest is a CI-only runner (not a runtime dep). It runs the
          # existing unittest-style tests as-is + gives clean exit codes
          # and --ignore filtering for the quarantined modules.
          pip install pytest

      - name: Run unit-tier tests
        env:
          # Minimal env so import-time guards don't hard-crash. These
          # are placeholders — the quarantined integration tests that
          # need REAL creds are excluded below, so dummy values here
          # only keep the unit modules' import guards happy.
          JWT_SECRET: ci-placeholder-secret
          SUPABASE_URL: https://ci-placeholder.invalid
          SUPABASE_KEY: ci-placeholder-key
        run: |
          # QUARANTINE — integration-tier modules that need live
          # Supabase / network. They fail in CI for environmental
          # reasons, not real regressions. Run them locally against a
          # real env, or wire secrets + stubs later to un-quarantine.
          pytest \
            --ignore=test_admin_student_profile_regressions.py \
            --ignore=test_guest_funnel.py \
            --ignore=test_homework_regressions.py \
            --ignore=test_score_unification.py \
            --ignore=test_sentry.py \
            --ignore=test_auth_request.py \
            -p no:cacheprovider \
            -q

  # Lounge-bot behavioral probe (tests/evals/master_doc_probe.py). This is
  # the ONLY gate that catches silent persona/capability drift in the
  # master-doc system prompt (the attention-ceiling failure mode). It makes
  # live OpenAI calls (~$0.06/run), so it can only gate when OPENAI_API_KEY
  # is configured as a repo secret. Until then the step SKIPS green (it does
  # NOT fail for a missing credential) — the gate is armed, not red-on-day-1.
  # To activate: add OPENAI_API_KEY under Settings → Secrets → Actions.
  master-doc-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.1"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnose OPENAI_API_KEY (TEMPORARY — no secret leak)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Same placeholder env the probe step uses, so importing
          # services.* (→ services.db) behaves identically here.
          JWT_SECRET: ci-placeholder-secret
          SUPABASE_URL: https://ci-placeholder.invalid
          SUPABASE_KEY: ci-placeholder-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "secret EMPTY in job"; exit 0; fi
          # Replicate the EXACT path the probe uses: config.OPENAI_API_KEY
          # + services.openai_service.OpenAIService. Direct os.environ +
          # bare openai SDK already proved OK, so the divergence (if any)
          # is in config/services. Prints key facts (len/class), never the
          # value.
          python3 - <<'PY'
          import os
          from config import Config
          cfg = Config()
          k = cfg.OPENAI_API_KEY or ""
          env = os.environ.get("OPENAI_API_KEY", "")
          cls = ("sk-proj-" if k.startswith("sk-proj-")
                 else "sk-" if k.startswith("sk-") else "OTHER/empty")
          print("config.OPENAI_API_KEY len:", len(k), "| class:", cls,
                "| equals_env:", k == env)
          try:
              from services.openai_service import OpenAIService
              s = OpenAIService()
              print("OpenAIService client set?", bool(s.client))
              r = s.client.chat.completions.create(
                  model="gpt-4o-mini",
                  messages=[{"role": "user", "content": "hi"}],
                  max_tokens=5,
              )
              print("services path chat OK:", (r.choices[0].message.content or "")[:20])
          except Exception as e:
              print("services path ERROR:", type(e).__name__, "|", str(e)[:300])
          PY

      - name: Run master_doc probe (skips without OPENAI_API_KEY)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Placeholders so import-time config guards don't crash; the
          # probe only needs the real OpenAI key above. The probe
          # transitively constructs services.db (DatabaseService() at
          # import → create_client), which raises on an empty key — so
          # SUPABASE_SERVICE_ROLE_KEY must be a NON-EMPTY placeholder
          # (the probe never queries the DB, so any value works).
          JWT_SECRET: ci-placeholder-secret
          SUPABASE_URL: https://ci-placeholder.invalid
          SUPABASE_KEY: ci-placeholder-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not set — skipping the probe gate."
            echo "Add it under Settings → Secrets → Actions to enable it."
            exit 0
          fi
          python tests/evals/master_doc_probe.py
