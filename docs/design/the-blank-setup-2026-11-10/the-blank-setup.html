.big { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin: 8px 0 0; text-wrap: balance; }
.listrow { border: 0; border-bottom: 1px solid var(--line); background: none; display: flex; gap: 12px; align-items: center; padding: 14px 4px; text-align: left; width: 100%; }

.box button { height: 46px; border-radius: 999px; border: 0; background: var(--ink); color: var(--panel); padding: 0 18px; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 7px; }
@media (max-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr); } .tabs { display: flex; } body[data-tab="map"] .side, body[data-tab="phone"] .map { display: none; } .side { position: static; } .phone { height: min(760px, calc(100vh - 140px)); } }
@media (prefers-reduced-motion: no-preference) { .bd > * { animation: in .18s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }

<div class="top"><h1>Build your chat, from nothing</h1><div class="tabs" role="tablist"><button type="button" id="tab-map" data-tab="map">The journey</button><button type="button" id="tab-phone" data-tab="phone">Try it</button></div><button type="button" class="again" id="again">Start again</button></div>
<div class="wrap"><div class="map" id="map"></div><div class="side"><div class="phone" id="phone"></div></div></div>

    "speaking coach": { line: ["People come to you to speak so others listen.", "People come to you to feel sure when they talk."], send: ["rec", "text", "file", "photo"], out: ["words", "answer", "todo", "mark"],

"line": 2 different one-sentence versions of "People come to you ..." saying why people come to this specialist;
"send": the ids "rec" (voice recording), "text" (typed message), "photo", "file", ordered from what people would most naturally send to least;

"qs": 3 short questions the chat asks a new person first;

    if (bind) bind(); paintMap();
  }
  const kcFoot = (typeLabel) => `<div class="row2"><button type="button" class="btn out" id="chg">Change</button><button type="button" class="btn" id="keep">Keep</button></div>${typeLabel ? `<button type="button" class="lnk" id="own">${esc(typeLabel)}</button>` : ""}`;
  // one decision: Will's line, the thing, Keep or Change; "Type my own" goes to Will's chat and comes back here
  function kc(id, line, list, show, typeAsk) {
    draw({ body: say(line) + show(pick(id, list)), foot: kcFoot(typeAsk ? "Type my own" : ""), bind: () => {
      $("#keep", phone).onclick = () => next();
      $("#chg", phone).onclick = () => { S.own[id] = null; S.i[id] = (S.i[id] || 0) + 1; render(); };
      const o = $("#own", phone); if (o) o.onclick = () => typeIn(typeAsk, (v) => { S.own[id] = v; render(); });
    } });
  }
  // typing always happens in Will's chat, then you come back to the screen you were on
  function typeIn(ask, done, ph = "Type here") {
    S.thread.push({ w: true, t: ask });
    const paint = () => {
      phone.innerHTML = `<div class="hd"><button type="button" class="bk" id="bk" >‹ Back</button><span class="av">•••</span><b>Will</b></div><div class="bd">${S.thread.map((m) => `<div class="${m.w ? "w" : "me"}">${esc(m.t)}</div>`).join("")}</div><form class="box" id="f"><input id="say" type="text" maxlength="120" placeholder="${esc(ph)}" autocomplete="off"><button type="submit">Send</button></form>`;
      const bd = $(".bd", phone); bd.scrollTop = bd.scrollHeight;
      $("#bk", phone).onclick = () => { S.thread.pop(); render(); };
      $("#f", phone).onsubmit = (e) => { e.preventDefault(); const v = $("#say", phone).value.trim(); if (!v) return; S.thread.push({ w: false, t: v }); done(v); };
      $("#say", phone).focus({ preventScroll: true });
    };
    paint(); paintMap();
  }
  const sample = () => { const k = sendKey(); return k === "text" ? `<div class="me">${esc(S.sug.sample_in)}</div>` : `<div class="tile">${k === "rec" ? "▶ " : ""}${esc(SEND[k][0])}<br>${esc(S.sug.sample_in)}</div>`; };
  const draft = () => { const own = S.own.mq; const base = S.sug.models[S.mi % S.sug.models.length]; return own ? { q: own, opts: OPTS[(S.i.mopts || 0) % OPTS.length], says: `${own} ${OPTS[(S.i.mopts || 0) % OPTS.length][0]}.` } : base; };
  const ready = () => REG.filter((m) => sendKeys().includes(m.send) && !S.models.some((x) => x.q === m.q));
  /* ---------- the steps: one thing each ---------- */
  const STEPS = [
    { id: "will", stage: 0, t: "Your chats", s: "Tap Will", r: () => {
        phone.innerHTML = `<div class="nav"><span class="logo"><span class="dots"><i></i><i></i><i></i></span>WillpowerLab</span><span class="menu" aria-hidden="true"><i></i><i></i><i></i></span></div>
          <div class="clist"><button type="button" class="crow" id="go"><span class="wm"><i></i><i></i><i></i></span><span class="cmid"><span class="c1"><b>Will</b><em>now</em></span><span class="c2"><span class="cl new">Hi ${esc(S.name)}. Let's build your chat.</span><i class="cdot"></i><span class="pin" aria-hidden="true">📌</span></span></span></button>
          <button type="button" class="crow" id="add"><span class="wm plus">+</span><span class="cmid"><span class="c1"><b class="reg">Add someone to chat with</b></span></span></button></div>
          <button type="button" class="fab" id="fab" aria-label="Add someone to chat with">+</button><div id="note"></div>`;
        const note = () => { $("#note", phone).innerHTML = `<div class="snote"><span><b>Before you share your link, set the questions for people who join.</b><button type="button" class="setb" id="set">Set them</button></span><button type="button" class="nx" id="nx" aria-label="Not now">×</button></div>`; $("#set", phone).onclick = next; $("#nx", phone).onclick = () => { $("#note", phone).innerHTML = ""; }; };
        $("#go", phone).onclick = next; $("#add", phone).onclick = note; $("#fab", phone).onclick = note; paintMap(); } },
    { id: "what", stage: 0, t: "Say what you do", s: "Type it, in Will's chat", r: () => draw({ body: say(`Hi ${S.name}. I'm Will. I ask one thing at a time. You tap Keep or Change.`) + say("What do you do?"), foot: `<button type="button" class="btn" id="go">Answer</button>`, bind: () => { $("#go", phone).onclick = () => typeIn("What do you do?", begin, "Speaking coach"); } }) },
    { id: "line", stage: 1, t: "Why people come", s: "Keep / Change", r: () => kc("line", "People come to you for this:", S.sug.line, (v) => card(v), "Why do people come to you?") },
    { id: "send", stage: 1, t: "What they send", s: "Tick all that apply", r: () => { if (!S.sendSet) S.sendSet = [S.sug.send[0]];
        draw({ body: say("What do people send you? Tick all that apply.") + S.sug.send.map((k) => `<button type="button" class="opt tick${S.sendSet.includes(k) ? " on" : ""}" data-k="${k}" role="checkbox" aria-checked="${S.sendSet.includes(k)}"><i class="bx" aria-hidden="true"></i><span><b>${esc(SEND[k][0])}</b><small>${esc(SEND[k][1])}</small></span></button>`).join(""),
          foot: `<button type="button" class="btn" id="keep"${S.sendSet.length ? "" : " disabled"}>Done</button>`, bind: () => {
            phone.querySelectorAll("[data-k]").forEach((x) => (x.onclick = () => { const k = x.dataset.k; S.sendSet = S.sendSet.includes(k) ? S.sendSet.filter((y) => y !== k) : [...S.sendSet, k]; render(); }));
            $("#keep", phone).onclick = () => next(); } }); } },
    { id: "out", stage: 1, t: "What they get back", s: "Keep / Change", r: () => kc("out", "They get back:", S.sug.out, (k) => card(OUT[k][0], OUT[k][1])) },
    { id: "hello", stage: 1, t: "Your hello", s: "Keep / Change", r: () => kc("hello", "Your chat opens with:", S.sug.hello, (v) => `<div class="card"><div class="w">${esc(v)}</div></div>`, "What should your chat say first?") },
    { id: "q", stage: 1, t: "First questions", s: "Keep / Change", r: () => { const n = S.qs.length; kc("q" + n, "Then it asks:", S.sug.qs.slice(n).concat(S.sug.qs.slice(0, n)), (v) => card(v), "What should your chat ask first?"); } },
    { id: "qmore", stage: 1, t: "One more?", s: "Yes / No", r: () => draw({ body: say("Ask one more question?") + chips(S.qs), foot: `<div class="row2"><button type="button" class="btn out" id="no">No</button><button type="button" class="btn" id="yes">Yes</button></div>`, bind: () => { $("#no", phone).onclick = () => next(); $("#yes", phone).onclick = () => { cur = idx("q"); render(); }; } }) },
    { id: "taps", stage: 1, t: "What people can ask", s: "Keep / Change", r: () => kc("taps", "People tap what they want:", S.sug.taps, (v) => chips([...(Array.isArray(v) ? v : [v]), "Something else"]), "What do people ask you for?") },
    { id: "model", stage: 2, t: "Make a model", s: "One question, three answers", r: () => {
        const rd = ready()[0];
        if (rd && !S.skipReady) return draw({ body: say("A model already exists for this.") + card(rd.q, rd.opts.join(" · ")) + cap(`${rd.by} made it. You pay ${rd.price} tokens each use. Your people pay nothing.`), foot: `<div class="row2"><button type="button" class="btn out" id="no">Make my own</button><button type="button" class="btn" id="yes">Use it</button></div>`, bind: () => { $("#yes", phone).onclick = () => { S.models.push({ ...rd, ready: true }); cur = idx("more"); render(); }; $("#no", phone).onclick = () => { S.skipReady = true; render(); }; } });
        const d = draft();
        draw({ body: say(S.models.length ? "Your next model:" : "Now a model. It learns one thing from you.") + card(d.q, d.opts.join(" · ")) + cap("One question, three answers. That is a model."), foot: kcFoot("Type my own"), bind: () => {
          $("#keep", phone).onclick = () => { S.models.push({ ...d, taught: [], price: null }); S.own.mq = null; S.t = 0; S.c = 0; next(); };
          $("#chg", phone).onclick = () => { if (S.own.mq) S.i.mopts = (S.i.mopts || 0) + 1; else S.mi++; render(); };
          $("#own", phone).onclick = () => typeIn("What should it spot? Write it as a question.", (v) => { S.own.mq = /\?$/.test(v) ? v : v + "?"; render(); }, "Is this a dry scalp?");
        } }); } },
    { id: "teach", stage: 2, t: "Teach it", s: "You answer", r: () => { const m = S.models[S.models.length - 1]; draw({ body: say(`Teach it. Example ${S.t + 1} of 3.`) + sample() + `<div class="card"><b>${esc(m.q)}</b></div>` + m.opts.map((o, k) => `<button type="button" class="opt" data-o="${k}">${esc(o)}</button>`).join("") + cap("In the app you answer 10. Here, 3 is enough."), bind: () => { phone.querySelectorAll("[data-o]").forEach((b) => (b.onclick = () => { m.taught.push(+b.dataset.o); S.t++; if (S.t >= 3) next(); else render(); })); } }); } },
    { id: "check", stage: 2, t: "Check its guesses", s: "Keep / Change", r: () => { const m = S.models[S.models.length - 1], g = m.opts[(m.taught[S.c] ?? S.c) % 3]; draw({ body: say("Now it guesses. You check.") + sample() + card(m.q, `Its guess: ${g}`), foot: kcFoot(""), bind: () => {
        const on = () => { S.c++; if (S.c >= 2) next(); else render(); };
        $("#keep", phone).onclick = on;
        $("#chg", phone).onclick = () => draw({ body: say("What's the right answer?") + m.opts.filter((o) => o !== g).map((o) => `<button type="button" class="opt" data-o="1">${esc(o)}</button>`).join("") + cap("Each fix teaches it."), bind: () => { phone.querySelectorAll("[data-o]").forEach((b) => (b.onclick = on)); } });
      } }); } },
    { id: "more", stage: 2, t: "Another model?", s: "Yes / No", r: () => draw({ body: say("Add another model?") + S.models.map((m) => card(m.q, m.opts.join(" · "))).join(""), foot: `<div class="row2"><button type="button" class="btn out" id="no">No</button><button type="button" class="btn" id="yes"${S.models.length >= 3 ? " disabled" : ""}>Yes</button></div>`, bind: () => { $("#no", phone).onclick = () => next(); $("#yes", phone).onclick = () => { S.mi++; S.skipReady = false; cur = idx("model"); render(); }; } }) },
    { id: "order", stage: 2, t: "The order", s: "Keep / Change", skip: () => S.models.length < 2, r: () => draw({ body: say("Your models speak in this order:") + S.models.map((m, k) => card(`${k + 1}. ${m.q}`)).join(""), foot: kcFoot(""), bind: () => { $("#keep", phone).onclick = () => next(); $("#chg", phone).onclick = () => { S.models.push(S.models.shift()); render(); }; } }) },
    { id: "who", stage: 3, t: "Who answers", s: "Keep / Change", r: () => kc("who", "When someone asks you a question:", WHO.map((w) => w[0]), (v) => card(v)) },
    { id: "share", stage: 3, t: "Share your model", s: "Yes / Not now", r: () => draw({ body: say("Let others use your models? They pay you in tokens.") + cap("Tokens are what you spend in the app."), foot: `<div class="row2"><button type="button" class="btn out" id="no">Not now</button><button type="button" class="btn" id="yes">Yes</button></div>`, bind: () => { $("#no", phone).onclick = () => { S.shared = false; cur = idx("try"); render(); }; $("#yes", phone).onclick = () => { S.shared = true; next(); }; } }) },
    { id: "price", stage: 3, t: "Its price", s: "Keep / Change", skip: () => !S.shared, r: () => kc("price", "Each use costs them:", PRICES, (v) => card(`${v} token${v === 1 ? "" : "s"}`)) },
    { id: "try", stage: 4, t: "See it as your people do", s: "Walk through it", r: () => draw({ body: say("Your chat is ready. See it as your people will."), foot: `<button type="button" class="btn" id="go">See it</button>`, bind: () => { $("#go", phone).onclick = () => { T = 0; render(); }; } }) },
    { id: "live", stage: 4, t: "Open it to people", s: "Yes / Not yet", r: () => draw({ body: say("Open your chat to people?") + cap("Anyone with your link can use it."), foot: `<div class="row2"><button type="button" class="btn out" id="no">Not yet</button><button type="button" class="btn" id="yes">Yes</button></div>`, bind: () => { $("#no", phone).onclick = () => { S.live = false; next(); }; $("#yes", phone).onclick = () => { S.live = true; next(); }; } }) },
    { id: "done", stage: 4, t: "Your chat", s: "Tap a part to change it", r: () => { S.edit = true; const rows = [["line", "Why people come", pick("line", S.sug.line)], ["send", "They send", sendKeys().map((k) => SEND[k][0]).join(" · ")], ["out", "They get back", OUT[outKey()][0]], ["hello", "Your hello", pick("hello", S.sug.hello)], ["q", "First questions", S.qs.join(" · ")], ["taps", "They can ask", [].concat(pick("taps", S.sug.taps)).join(" · ")], ["more", "Your models", S.models.map((m) => m.q).join(" · ")], ["who", "Who answers", pick("who", WHO.map((w) => w[0]))]];
        draw({ title: `${S.spec}`, body: say(S.live ? "Your chat is open. Share your link." : "Your chat is saved. Nobody can see it yet.") + (S.live ? `<div class="card"><b>willpowerlab.com/c/${esc(S.name.toLowerCase())}</b><small>This link opens your chat.</small></div>` : "") + rows.map(([id, k, v]) => `<button type="button" class="opt" data-j="${id}"><small style="display:block;color:var(--muted);font-weight:500;font-size:13px">${esc(k)}</small>${esc(v)}</button>`).join(""), foot: `<button type="button" class="btn" id="go">See it as your people do</button><button type="button" class="lnk" id="other">Start again as someone else</button>`, bind: () => {
          phone.querySelectorAll("[data-j]").forEach((b) => (b.onclick = () => { if (b.dataset.j === "q") S.qs = []; cur = idx(b.dataset.j); render(); }));
          $("#go", phone).onclick = () => { T = 0; render(); };
          $("#other", phone).onclick = () => { if (S.shared) S.models.filter((m) => !m.ready).forEach((m) => REG.push({ q: m.q, opts: m.opts, says: m.says, by: S.name, send: sendKey(), price: pick("price", PRICES) })); const nm = S.name === "Artur" ? "Kasia" : "Lena"; fresh(); S.name = nm; cur = idx("what"); render(); };
        } }); } },
  ];
  const idx = (id) => STEPS.findIndex((s) => s.id === id);
  const prevIdx = () => { let k = cur - 1; while (k > 0 && STEPS[k].skip && STEPS[k].skip()) k--; return k; };
  function next() {
    const id = STEPS[cur].id;
    if (id === "q") { const n = S.qs.length; S.qs.push(pick("q" + n, S.sug.qs.slice(n).concat(S.sug.qs.slice(0, n)))); if (S.qs.length >= 3) { cur = idx("taps"); return render(); } }
    if (S.edit && !["q", "qmore", "model", "teach", "check", "try", "live"].includes(id)) { cur = idx("done"); return render(); }
    do { cur++; } while (STEPS[cur].skip && STEPS[cur].skip());
    render();
  }
  async function begin(v) {
    const spec = v[0].toUpperCase() + v.slice(1), mine = ++run; S.spec = spec;
    draw({ body: say(`${spec}. One moment.`), back: false });
    let j = null;
    try { const use = window.claude && window.claude.use ? await Promise.race([window.claude.use("sample"), new Promise((r) => setTimeout(() => r(null), 4000))]) : null; if (use) j = await Promise.race([use.json(PROMPT(spec), { modelTier: "quick" }), new Promise((r) => setTimeout(() => r(null), 25000))]); } catch (e) { j = null; }
    if (mine !== run) return;
    S.sug = clean(spec, j); cur = idx("line"); render();
  }
  /* ---------- the same chat, as the person who came to learn meets it ---------- */
  function tryIt() {
    const who = pick("who", WHO.map((w) => w[0])), mode = WHO.find((w) => w[0] === who)[1], k = sendKey(), o = outKey(), from = mode === "you" ? S.name : `${S.name}'s assistant`;
    const seq = ["hello", ...S.qs.map((_, i) => "q" + i), "ask", "send", "out", ...S.models.map((_, i) => i), "useful", "end"], at = seq[Math.min(T, seq.length - 1)];
    const fwd = () => { if (at === "end") { T = null; cur = idx(S.edit ? "done" : "live"); } else T++; render(); };
    const one = (label, rec) => `<button type="button" class="btn" id="go">${rec ? "<i></i>" : ""}${esc(label)}</button>`, sendLabel = { rec: "Record", text: "Send", photo: "Send a photo", file: "Send a file" }[k];
    let body, foot = one("Next");
    if (at === "hello") body = `<div class="w">${esc(pick("hello", S.sug.hello))}</div>`;
    else if (typeof at === "string" && at[0] === "q") { body = `<div class="w">${esc(S.qs[+at.slice(1)])}</div>`; foot = one("Answer"); }
    else if (at === "ask") { body = `<div class="w">What would you like to do?</div>` + [].concat(pick("taps", S.sug.taps), "Something else").map((x) => `<button type="button" class="opt" data-go="1">${esc(x)}</button>`).join(""); foot = ""; }
    else if (at === "send") { body = sample(); foot = one(sendLabel, k === "rec"); }
    else if (at === "out") body = (o === "mark" ? `<div class="tile">${esc(SEND[k][0])} · the spot is marked</div>` : "") + (o === "todo" ? `<div class="card"><b>What to do next</b>${S.models.map((m) => `<small>· ${esc(m.says)}</small>`).join("")}</div>` : `<div class="w">${esc(S.sug.sample_out)}</div>`) + `<p class="cap"><span class="dot"></span>${esc(from)}</p>`;
    else if (at === "useful") { body = `<div class="w">Was this useful?</div>` + ["Yes", "No"].map((x) => `<button type="button" class="opt" data-go="1">${x}</button>`).join(""); foot = `<button type="button" class="lnk" id="go">Skip</button>`; }
    else if (at === "end") { body = `<div class="w">Send the next one when you're ready.</div>`; foot = one("Back to my setup"); }
    else { const m = S.models[at]; body = `<div class="w">${esc(m.says || `${m.q} ${m.opts[0]}.`)}</div><p class="cap"><span class="dot"></span>${esc(m.ready ? `${m.by}'s model` : `${S.name}'s model`)} · ${at + 1} of ${S.models.length}</p>`; }
    phone.innerHTML = `<div class="hd"><button type="button" class="bk" id="bk" >‹ Back</button><b>${esc(S.name)}</b><button type="button" class="x" id="x" aria-label="Close">×</button></div><div class="bd">${cap("This is what your people see.")}${body}</div>${foot ? `<div class="ft">${foot}</div>` : ""}`;
    $("#bk", phone).onclick = () => { if (T > 0) T--; else T = null; render(); }; $("#x", phone).onclick = () => { T = null; render(); };
    const g = $("#go", phone); if (g) g.onclick = fwd; phone.querySelectorAll("[data-go]").forEach((b) => (b.onclick = fwd));
    paintMap();
  }
  function render() { if (T != null) return tryIt(); STEPS[cur].r(); }
  /* ---------- the map: every step of the journey; it follows the phone, and a tap opens that step ---------- */
  const STAGES = [["You arrive", "Your list of chats has one chat: Will."], ["Your chat", "What people send, what they get back, how it greets them."], ["Your models", "A model answers one question with one of three answers. It learns from you."], ["Answers and tokens", "Who answers, and whether others may use your models."], ["Open it", "See it as your people do, then share your link."]];
  function ensure() {   // jumping in from the map: fill what is not decided yet with Will's first suggestion
    if (!S.sug) { S.spec = S.spec || "Speaking coach"; S.sug = clean(S.spec, null); }
    if (!S.qs.length) S.qs = [S.sug.qs[0]];
    if (!S.models.length) S.models = [{ ...S.sug.models[0], taught: [0, 1, 0], price: null }];
  }
  function paintMap() {
    $("#map").innerHTML = STAGES.map(([h, p], si) => `<section class="stage"><h2>${si + 1}. ${esc(h)}</h2><p>${esc(p)}</p><div class="nodes">${STEPS.map((s, k) => (s.stage === si ? `<button type="button" class="node${k === cur && T == null ? " on" : k < cur ? " done" : ""}" data-n="${k}"><b>${esc(s.t)}</b><small>${esc(s.s)}</small></button><span class="arrow" aria-hidden="true">›</span>` : "")).join("").replace(/<span class="arrow" aria-hidden="true">›<\/span>$/, "")}</div></section>`).join('<div class="down" aria-hidden="true">↓</div>') + `<p class="loop">After that, it keeps learning. Every answer you give, every guess you fix, and every “Was this useful?” teaches your models. You can change any part by telling Will.</p>`;
    $("#map").querySelectorAll("[data-n]").forEach((b) => (b.onclick = () => { const k = +b.dataset.n; if (k > idx("what")) ensure(); T = null; S.edit = false; cur = k; if (STEPS[k].id === "teach" || STEPS[k].id === "check") { S.t = 0; S.c = 0; S.models[S.models.length - 1].taught = STEPS[k].id === "check" ? [0, 1, 0] : []; } if (STEPS[k].id === "q") S.qs = []; setTab("phone"); render(); }));
  }
  const setTab = (t) => { document.body.dataset.tab = t; document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === t)); };
  document.querySelectorAll(".tabs [data-tab]").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
  $("#again").onclick = () => { REG.length = 0; fresh(); render(); };
  fresh(); setTab("map"); render();
})();
</script>
