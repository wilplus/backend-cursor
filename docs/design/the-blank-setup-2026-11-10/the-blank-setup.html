<!doctype html>

<body>
<title>Build Your Chat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: the journey as a map on the left, one phone on the right; the map follows the phone, the phone follows the map. */
:root { --bg: #EFEDE8; --panel: #FFFFFF; --ink: #121212; --muted: #6E6A64; --line: #E3E0DA; --bubble: #F3F2EF; --accent: #FF640A; --ok: #1F9D55; --rec: #EF4444; --ui: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151413; --panel: #1F1E1C; --ink: #F4F2EE; --muted: #A39E96; --line: #34322F; --bubble: #2B2A27; --accent: #FF7A2E; --ok: #3CC47A; --rec: #F26666; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #151413; --panel: #1F1E1C; --ink: #F4F2EE; --muted: #A39E96; --line: #34322F; --bubble: #2B2A27; --accent: #FF7A2E; --ok: #3CC47A; --rec: #F26666; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--ui); padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { max-width: 1120px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.top h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.tabs { display: none; gap: 6px; }
.tabs button, .again { border: 1.5px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; }
.tabs button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; align-items: start; }
/* the map */
.map { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stage { background: var(--panel); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.stage h2 { margin: 0; font-size: 15px; font-weight: 700; } .stage p { margin: 0; color: var(--muted); font-size: 13.5px; }
.nodes { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.node { border: 1.5px solid var(--line); background: var(--panel); border-radius: 14px; padding: 8px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; max-width: 100%; }
.node b { font-size: 14px; font-weight: 600; } .node small { font-size: 12px; color: var(--muted); }
.node.done { border-color: var(--ok); } .node.on { border-color: var(--ink); background: var(--ink); color: var(--panel); } .node.on small { color: inherit; opacity: .75; }
.arrow { align-self: center; color: var(--muted); font-size: 18px; }
.down { text-align: center; color: var(--muted); font-size: 18px; line-height: 1; }
.loop { color: var(--muted); font-size: 13.5px; border: 1.5px dashed var(--line); border-radius: 14px; padding: 10px 14px; }
/* the phone */
.side { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; min-width: 0; }
.phone { width: 100%; max-width: 390px; height: min(780px, calc(100vh - 110px)); min-height: 560px; background: var(--panel); border: 9px solid #111; border-radius: 42px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.hd { flex: none; height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.hd b { font-size: 16px; flex: 1; } .hd .bk, .hd .x { border: 0; background: none; font-size: 22px; width: 32px; height: 32px; border-radius: 50%; }
.hd .bk { width: auto; font-size: 15px; font-weight: 600; padding: 0 8px 0 0; border-radius: 8px; }
.hd .av { width: 36px; height: 36px; border-radius: 50%; background: var(--bubble); color: var(--ink); display: grid; place-items: center; font-size: 11px; letter-spacing: 1px; font-weight: 700; }
.bd { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 12px; }
.ft { flex: none; padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.row2 { display: flex; gap: 10px; } .row2 > * { flex: 1; }
.btn { min-height: 50px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--panel); font-weight: 600; font-size: 15.5px; padding: 0 16px; display: flex; align-items: center; justify-content: center; gap: 9px; }
.btn.out { background: var(--panel); color: var(--ink); }
.btn i { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); display: inline-block; }
.lnk { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 4px; align-self: center; text-decoration: underline; text-underline-offset: 3px; }
.w { align-self: flex-start; max-width: 92%; background: var(--bubble); border-radius: 20px; padding: 11px 15px; font-size: 16.5px; line-height: 1.4; }
.me { align-self: flex-end; max-width: 88%; background: var(--accent); color: #fff; border-radius: 20px; padding: 10px 15px; font-size: 16px; }
.card { border: 1.5px solid var(--line); border-radius: 18px; padding: 14px 15px; display: flex; flex-direction: column; gap: 6px; }
.card b { font-size: 17px; font-weight: 600; line-height: 1.3; } .card small { font-size: 16px; font-weight: 400; }
.cap { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; } .chips span { border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.opt:disabled { opacity: .5; cursor: default; }
.sw { margin-left: auto; display: flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 2px; flex: none; } .sw button { width: auto; padding: 5px 12px; border: 0; background: none; color: var(--ink); border-radius: 999px; font-size: 13.5px; font-weight: 600; } .sw button.on { background: var(--ink); color: var(--panel); }
.devrow { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 600; } .tg { width: 46px; height: 28px; border-radius: 999px; border: 0; background: var(--line); position: relative; padding: 0; } .tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--panel); transition: left .15s; } .tg.on { background: var(--ink); } .tg.on::after { left: 21px; }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--ink); border-radius: 999px; } .cols { display: flex; align-items: flex-end; gap: 6px; height: 96px; } .cols i { flex: 1; background: var(--ink); border-radius: 6px 6px 0 0; min-height: 3px; } .li { display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.35; } .li b { flex: none; width: 18px; }
.tabs { flex: none; display: flex; border-bottom: 1px solid var(--line); } .tabs button { flex: 1; padding: 12px 0; font-size: 15px; font-weight: 600; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; } .tabs button.on { color: var(--ink); background: none; border-bottom-color: var(--ink); }
.stack { display: flex; flex-direction: column; gap: 3px; } .blk { border: 0; background: var(--ink); color: var(--panel); border-radius: 10px; padding: 14px 16px; text-align: left; font-size: 16px; font-weight: 600; }
.opt.on { border-color: var(--ink); } .rec { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: var(--accent); color: #fff; margin-bottom: 6px; }
.tapme { align-self: flex-end; max-width: 88%; border: 0; background: var(--accent); color: #fff; border-radius: 20px; padding: 10px 15px; font-size: 16px; font-weight: 500; text-align: left; } .tapsr { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; } .tapsr.row { flex-direction: row; justify-content: flex-end; flex-wrap: wrap; }
.opt { border: 1.5px solid var(--line); background: var(--panel); border-radius: 16px; padding: 13px 15px; text-align: left; font-size: 16px; font-weight: 600; }
.tick { display: flex; align-items: center; gap: 12px; } .tick span { display: flex; flex-direction: column; } .tick small { font-weight: 400; font-size: 16px; }
.bx { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; } .tick.on { border-color: var(--ink); } .tick.on .bx { background: var(--ink); border-color: var(--ink); } .tick.on .bx::after { content: "✓"; color: var(--panel); font-size: 14px; font-style: normal; }
.btn:disabled { opacity: .4; cursor: default; }
.exi { align-self: flex-end; max-width: 78%; max-height: 220px; object-fit: cover; border-radius: 16px; display: block; }
.cbig { display: flex; align-items: baseline; gap: 8px; } .cbig b { font-size: 40px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; } .cbig span { color: var(--muted); font-size: 15px; }
.cin { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .cin label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.cin input { height: 46px; width: 100%; border-radius: 14px; border: 1.5px solid var(--line); background: transparent; color: inherit; font: 600 17px inherit; font-family: inherit; padding: 0 12px; }
.crow2 { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); } .crow2:first-child { border-top: 0; padding-top: 0; } .crow2:last-child { padding-bottom: 0; }
.crow2 span { display: flex; flex-direction: column; font-weight: 600; font-size: 15px; min-width: 0; } .crow2 small { font-weight: 400; font-size: 15px; } .crow2 b { white-space: nowrap; font-size: 15px; } .crow2.tot span { font-weight: 400; color: var(--muted); }
.dots3 { align-self: flex-start; display: flex; gap: 5px; background: var(--bubble); border-radius: 18px; padding: 13px 15px; } .dots3 i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: block; animation: d3 1.1s infinite ease-in-out; } .dots3 i:nth-child(2) { animation-delay: .15s; } .dots3 i:nth-child(3) { animation-delay: .3s; }
@keyframes d3 { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .dots3 i { animation: none; opacity: .7; } }
.tile { border-radius: 16px; background: var(--bubble); color: var(--muted); padding: 22px 14px; text-align: center; font-size: 14px; }
.nav { flex: none; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; } .dots { display: flex; align-items: center; gap: 3px; } .dots i, .wm i { border-radius: 50%; background: var(--ink); display: block; width: 5px; height: 5px; } .dots i:nth-child(2), .wm i:nth-child(2) { width: 7px; height: 7px; }
.menu { display: flex; flex-direction: column; gap: 4px; } .menu i { width: 20px; height: 2px; border-radius: 2px; background: var(--ink); display: block; }
.clist { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.crow { height: 76px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 0 0 16px; border: 0; background: none; text-align: left; width: 100%; }
.wm { width: 48px; height: 48px; border-radius: 50%; background: var(--bubble); display: flex; align-items: center; justify-content: center; gap: 3px; flex: none; } .wm.plus { font-size: 22px; }
.cmid { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 3px; border-bottom: 1px solid var(--line); padding-right: 16px; }
.c1 { display: flex; align-items: baseline; gap: 8px; } .c1 b { flex: 1; font-size: 16px; font-weight: 700; } .c1 b.reg { font-weight: 600; } .c1 em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--accent); }
.c2 { display: flex; align-items: center; gap: 8px; min-height: 20px; } .cl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; color: var(--muted); } .cl.new { font-weight: 700; color: var(--accent); }
.cdot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; } .pin { font-size: 12px; opacity: .5; filter: grayscale(1); }
.fab { position: absolute; right: 16px; bottom: 20px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--ink); color: var(--panel); font-size: 24px; line-height: 1; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
.snote { position: absolute; left: 10px; right: 10px; bottom: 20px; z-index: 3; display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 10px 4px 10px 14px; box-shadow: 0 6px 18px rgba(0,0,0,.14); }
.snote span { flex: 1; display: flex; flex-direction: column; gap: 8px; } .snote b { font-size: 15px; font-weight: 600; line-height: 1.35; } .setb { align-self: flex-start; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; font-size: 15px; padding: 8px 16px; } .nx { border: 0; background: none; width: 44px; height: 44px; font-size: 20px; color: var(--muted); }
.big { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin: 8px 0 0; text-wrap: balance; }
.listrow { border: 0; border-bottom: 1px solid var(--line); background: none; display: flex; gap: 12px; align-items: center; padding: 14px 4px; text-align: left; width: 100%; }
.listrow span { display: flex; flex-direction: column; } .listrow small { font-size: 15px; }
.box { display: flex; gap: 8px; padding: 10px 12px 14px; border-top: 1px solid var(--line); }
.box { align-items: flex-end; }
.box textarea { flex: 1; min-width: 0; min-height: 46px; max-height: 168px; resize: none; overflow-y: auto; border-radius: 23px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); padding: 11px 16px; font: 16px/1.4 var(--ui); display: block; }
.box button { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--ink); color: var(--panel); padding: 0; font-size: 20px; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 7px; }
@media (max-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr); } .tabs { display: flex; } body[data-tab="map"] .side, body[data-tab="phone"] .map { display: none; } .side { position: static; } .phone { height: min(760px, calc(100vh - 140px)); } }
@media (prefers-reduced-motion: no-preference) { .bd > * { animation: in .18s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>
<div class="top"><h1>Build your chat, from nothing</h1><div class="tabs" role="tablist"><button type="button" id="tab-map" data-tab="map">The journey</button><button type="button" id="tab-phone" data-tab="phone">Try it</button></div><span style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="again" id="second">Come in second</button><button type="button" class="again" id="again">Start again</button></span></div>
<div class="wrap"><div class="map" id="map"></div><div class="side"><div class="phone" id="phone"></div></div></div>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s), esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const phone = $("#phone");
  /* ---------- the building blocks ---------- */
  const SEND = { rec: ["A recording", "They talk. You listen."], text: ["A message", "They write to you."], photo: ["A photo", "They show you something."], file: ["A file", "A document or a clip."] };
  const OUT = { answer: ["An answer", "One message, in words."], words: ["Their own words, tidied", "What they said, made clear."], todo: ["What to do next", "A short list of steps."], mark: ["A mark on what they sent", "You point at the spot."] };
  const WHO = [["I draft the answer. You check it and send it.", "shadow"], ["Only you answer. I stay quiet.", "you"], ["I answer at once. You correct me.", "assistant"]];
  const OPTS = [["Yes", "Somewhat", "No"], ["Yes", "Not sure", "No"], ["A lot", "A little", "None"]];
  const PRICES = [2, 1, 3, 5];
  const EX = ["Speaking coach", "Trichologist", "Language teacher", "Fitness coach"];
  const KNOWN = {
    "speaking coach": { line: ["People come to you to speak so others listen.", "People come to you to feel sure when they talk."], send: ["rec", "text", "file", "photo"], out: ["words", "answer", "todo", "mark"],
      hello: ["Hi. Record a short talk, and I'll tell you what worked.", "Welcome. Say it out loud once. We'll make it better together."], qs: ["What talk are you getting ready for?", "Who will be listening?", "What is the one thing they should remember?"],
      taps: [["Practise a talk", "Get ready for a pitch", "Answer a hard question"], ["Sound more sure", "Stop rushing", "Open strongly"]],
      models: [{ q: "Does the speaker sound sure?", opts: ["Yes", "In between", "No"], says: "You sound sure at the start, and less sure near the numbers." }, { q: "Do they pause before the main line?", opts: ["Yes", "A little", "No"], says: "You ran through your main line. Stop before it." }, { q: "Are they rushing?", opts: ["Yes", "A little", "No"], says: "You speed up in the middle. Slow down there." }, { q: "Is the opening clear?", opts: ["Yes", "Somewhat", "No"], says: "Your opening is clear. People know what this is about." }],
      sample_in: "A two-minute talk about checking quotes.", sample_out: "Every quote we publish is checked twice. First by the editor who found it, then by someone who was not in the room." },
    trichologist: { line: ["People come to you with hair and scalp worries.", "People come to you to keep their hair healthy."], send: ["photo", "text", "rec", "file"], out: ["answer", "todo", "mark", "words"],
      hello: ["Hi. Send me a photo of your scalp, and tell me what worries you.", "Welcome. Show me, and I'll tell you what I'd do first."], qs: ["What worries you about your hair?", "How long has it been like this?", "What do you wash it with?"],
      taps: [["Look at my scalp", "My hair is falling out", "Which shampoo"], ["An itchy scalp", "After colouring", "Thin hair"]],
      models: [{ q: "Is this a dry scalp?", opts: ["Yes", "Somewhat", "No"], says: "Your scalp looks dry here. That is a common place to start." }, { q: "Is the hair thinning here?", opts: ["Yes", "Somewhat", "No"], says: "The hair is thinner at the crown than around it." }, { q: "Is the skin red?", opts: ["Yes", "Somewhat", "No"], says: "The skin looks a little red. Go gently with what you put on it." }, { q: "Are there flakes?", opts: ["A lot", "A little", "None"], says: "There are some flakes near the roots." }],
      sample_in: "A photo of the top of my head.", sample_out: "Thank you. I can see the crown clearly. Here is what I notice, and what I'd do first." },
    "language teacher": { line: ["People come to you to speak a new language.", "People come to you to stop making the same mistakes."], send: ["rec", "text", "file", "photo"], out: ["words", "answer", "todo", "mark"],
      hello: ["Hi. Say or write a few sentences. I'll show you the one thing to fix.", "Welcome. Tell me about your day, in the language you're learning."], qs: ["Which language are you learning?", "Why do you want to learn it?", "What is hardest for you?"],
      taps: [["Correct my sentence", "How do I say this", "Practise speaking"], ["Explain a rule", "Get ready for an exam", "New words"]],
      models: [{ q: "Is there a mistake that changes the meaning?", opts: ["Yes", "Not sure", "No"], says: "One word changes what you mean. Look at the verb." }, { q: "Is the past tense right?", opts: ["Yes", "Somewhat", "No"], says: "Two past forms slipped: went, bought." }, { q: "Does it sound natural?", opts: ["Yes", "Somewhat", "No"], says: "It is correct, and a native speaker would say it shorter." }],
      sample_in: "Yesterday I go to the shop and buyed bread.", sample_out: "Yesterday I went to the shop and bought bread." },
    "fitness coach": { line: ["People come to you to move well and get stronger.", "People come to you to train without getting hurt."], send: ["file", "photo", "text", "rec"], out: ["mark", "todo", "answer", "words"],
      hello: ["Hi. Send a clip of one exercise. I'll tell you the first thing to fix.", "Welcome. Show me how you move."], qs: ["What are you training for?", "How often do you train?", "Does anything hurt?"],
      taps: [["Check my form", "Plan my week", "Coming back after a break"], ["What to eat before", "A pain when I train", "Get stronger"]],
      models: [{ q: "Do the heels stay down?", opts: ["Yes", "Somewhat", "No"], says: "Your heels lift as you go down. Fix that first." }, { q: "Is the back straight?", opts: ["Yes", "Somewhat", "No"], says: "Your back rounds at the bottom." }, { q: "Is the movement slow enough?", opts: ["Yes", "Somewhat", "No"], says: "You drop fast. Count to three on the way down." }],
      sample_in: "A clip of my squat from the side.", sample_out: "Look at the moment just before the bottom." } };
  const generic = (spec) => { const s = spec.toLowerCase(); return { line: [`People come to you for help from a ${s}.`, `People come to you to learn what a ${s} knows.`], send: ["text", "rec", "photo", "file"], out: ["answer", "todo", "words", "mark"],
    hello: ["Hi. Tell me what you need, and I'll help.", "Welcome. Ask me anything about what I do."], qs: ["What do you need help with?", "What have you tried so far?", "What would a good result look like?"],
    taps: [["Ask for advice", "Check my work", "Show me how you do it"], ["Where do I start", "A second opinion", "Explain it simply"]],
    models: [{ q: "Is the main thing clear?", opts: ["Yes", "Somewhat", "No"], says: "Start here: this is the part that matters most." }, { q: "Is something missing?", opts: ["Yes", "Not sure", "No"], says: "One thing is missing. Add it and send it again." }, { q: "Is this ready?", opts: ["Yes", "Somewhat", "No"], says: "This is nearly ready. One more step." }],
    sample_in: `A question for a ${s}.`, sample_out: "Here is my answer, in plain words, from what you sent." }; };
  const PROMPT = (spec) => `You help a specialist set up a chat in which people learn from them or ask them things. The specialist is: ${spec}. Write for a 12-year-old: short, warm, plain words. No scores, numbers, grades or percentages about a person. For health, law or money never state a diagnosis or a final ruling.
Reply with only a JSON object with these keys:

  document.querySelectorAll(".tabs [data-tab]").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
  $("#again").onclick = () => { REG.length = 0; fresh(); render(); };
  // come in as someone who is not the first: two models already exist, each with its owner's price
  $("#second").onclick = () => { REG.length = 0; REG.push({ q: "Does the speaker sound sure?", opts: ["Yes", "In between", "No"], says: "You sound sure at the start, and less sure near the numbers.", by: "Artur", send: "rec", price: 2 }, { q: "Was each quote checked?", opts: ["Yes", "Not sure", "No"], says: "You quote someone here. Say where the quote is from.", by: "Kasia", send: "text", price: 3 }); fresh(); S.name = "Marta"; setTab("phone"); render(); };
  fresh(); setTab("map"); render();
})();
