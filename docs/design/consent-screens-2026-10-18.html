  } else {
    inner = (S.delCancelled ? '<p class="t14" style="margin-top:8px" role="status">'+DEL.cancelled+'</p>' : '')+
      '<p class="t14 muted" style="margin-top:8px;line-height:1.43">'+DEL.body+'</p>'+
      '<button type="button" class="sbtn red" data-act="del-open">'+DEL.button+'</button>';
  }
  return '<section class="del"><h2>'+DEL.title+'</h2>'+inner+'</section>';
}
function deleteDialog(){
  var body = DEL.confirmBody + (S.training || S.flow==="one" ? " "+DEL.modelStays : "");
  return '<div class="scrim" role="dialog" aria-modal="true" aria-labelledby="dlgt"><div class="dlg"><h2 id="dlgt">'+DEL.confirmTitle+'</h2><p>'+esc(body)+'</p>'+
    '<div class="row"><button type="button" class="btn o" data-act="del-dismiss">Cancel</button><button type="button" class="btn r" data-act="del-confirm">'+DEL.button+'</button></div></div></div>';
}
function renderData(){
  var one = S.flow==="one";
  app.innerHTML = header()+
    '<div class="scroll" id="scroll"><div class="dc"><h1>Data &amp; consent</h1>'+
    '<div class="ch"><p class="t14 muted'+(one?' newmark':'')+'">'+(one?C.introUnderTerms:C.introWithTraining)+'</p>'+sensitiveCard()+'</div>'+
    (one ? '' : '<div class="mt6">'+trainingCard()+'</div>')+
    deleteCard()+
    '<p class="links"><button type="button" data-act="win:privacy">Privacy Policy</button> · <button type="button" data-act="win:terms">Terms of Service</button></p>'+
    '</div></div>'+footer()+(S.delConfirm?deleteDialog():"");
}
function deletionDate(){
  var d = new Date(Date.now()+7*24*3600*1000);
  return d.toLocaleDateString("en-GB",{day:"numeric",month:"long"});
}

/* ------------------------------ windows ------------------------------ */
function docWindow(title, ver, body, closeAct, label){
  var phone = S.dev!=="desk";
  return '<div class="docmodal'+(phone?' phone':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(label)+'"><div class="doc"><div class="top"><h1>'+esc(title)+'</h1><p class="ver">'+esc(ver)+'</p></div><div class="body" tabindex="0">'+esc(body)+'</div><div class="bot">'+cta("Continue",closeAct)+'</div></div></div>';
}

/* ------------------------------ render ------------------------------ */
var lastKey = "";
function render(){
  var key = S.flow+"|"+S.screen+"|"+S.step+"|"+S.declined;
  var keep = key===lastKey;
  var sc = document.getElementById("scroll"), top = keep && sc ? sc.scrollTop : 0;
  ({welcome:renderWelcome, accept:renderAccept, lounge:renderLounge, ask:renderAsk, rec:renderRec, ideal:renderIdeal, data:renderData}[S.screen])();
  var sc2 = document.getElementById("scroll"); if(sc2) sc2.scrollTop = top;
  if(S.docOpen){ var d=DOCS[S.docOpen]; app.insertAdjacentHTML("beforeend", docWindow(d.title, "Version "+d.version, d.copy, "win-close", d.title)); }
  if(S.details){ app.insertAdjacentHTML("beforeend", docWindow(SEC4A_TITLE, "Privacy Policy 3.6, section 4a", SEC4A, "details-close", "Privacy Policy, section 4a")); }
  if(!keep){ Array.prototype.forEach.call(app.children,function(el){ if(!el.classList.contains("scrim")&&!el.classList.contains("docmodal")) el.classList.add("enter"); }); }
  lastKey = key;
  document.getElementById("pchip").innerHTML = S.flow==="one" ? 'Learning: <strong>part of the service</strong>' : 'Learning: <strong>'+(S.training?"on":"off")+'</strong>';
  document.querySelectorAll("[data-mode]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-mode")===S.mode));});
  document.querySelectorAll("[data-flow]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-flow")===S.flow));});
  document.getElementById("pnote").innerHTML = NOTES[S.flow];
  requestAnimationFrame(measure);
}
/* Does the screen fit without scrolling? Measured on the real layout, before the frame is scaled. */
function measure(){
  var chip = document.getElementById("fit"), sc = document.getElementById("scroll");
  var win = app.querySelector(".docmodal .body");
  if(win){ chip.className="fitchip"; chip.innerHTML = "Window: only the text scrolls"; return; }
  if(!sc){ chip.className="fitchip"; chip.innerHTML = "Screen: no scroll"; return; }
  var over = sc.scrollHeight - sc.clientHeight;
  if(over<=1){ chip.className="fitchip ok"; chip.innerHTML = "This screen <strong>fits</strong> without scrolling"; }
  else { chip.className="fitchip no"; chip.innerHTML = "This screen <strong>scrolls</strong> by "+over+" px"; }
}

app.addEventListener("change", function(ev){
  if(ev.target && ev.target.id==="country"){ S.country = ev.target.value || null; render(); }
});
app.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act]"); if(!el || el.disabled) return;
  var a = el.getAttribute("data-act"), arg = null, k = a.indexOf(":");
  if(k>0){ arg = a.slice(k+1); a = a.slice(0,k); }
  switch(a){
    case "enter":
      var w=document.getElementById("wel"); if(w) w.classList.add("leaving");
      setTimeout(function(){ S.screen = "accept"; S.step=firstStep(); render(); }, 220); return;
    /* windows (one and two screens, Data & consent) */
    case "win": S.docOpen = arg; S.seen[arg]=true; render(); return;
    case "win-close": S.docOpen = null; render(); return;
    case "two-continue": go("b"); return;
    /* today's flow */
    case "open": go(arg); return;
    case "notice-continue": go(S.seen.terms&&S.seen.privacy&&S.seen.ai ? "country" : "terms"); return;
    case "doc-done": go(nextStep(S.step)); return;
    case "doc-back": go(prevStep(S.step)); return;
    case "country":
      S.country = arg; render();
      if(advanceTimer) clearTimeout(advanceTimer);
      advanceTimer = setTimeout(function(){ advanceTimer=null; go("confirm"); }, COUNTRY_ADVANCE_MS); return;
    case "country-continue": go("confirm"); return;
    case "country-back": go(prevStep("country")); return;
    case "tick-age": S.age=!S.age; render(); return;
    /* shared */
    case "tick-sens": S.sens=!S.sens; render(); return;
    case "tick-practice": S.practiceTick=!S.practiceTick; render(); return;
    case "agree":
      S.saving = true; render();
      setTimeout(function(){
        S.saving=false; S.accepted=true; S.sensitive=true;
        if(S.flow!=="one" && S.practiceTick){ S.training=true; }
        S.screen="lounge"; render();
        if(S.flow==="one") ptoast("Receipt recorded: Terms 3.6, age, country, the recordings consent.");
        else if(S.practiceTick) ptoast("Learning is on: the question before each Take is not asked.");
      }, 600); return;
    case "decline": S.declined = true; render(); return;
    case "details": S.details=true; render(); return;
    case "details-close": S.details=false; render(); return;
    case "decl-back": S.declined=false; render(); return;
    case "decl-read": S.declined=false; if(S.flow==="today"){ go("terms"); } else { S.step=firstStep(); S.docOpen="terms"; S.seen.terms=true; render(); } return;
    /* Lounge + Takes */
    case "start-first": beginTake(1); return;
    case "ask-yes": S.training = true; S.screen="rec"; render(); ptoast("Learning is on. The question will not be asked again."); return;
    case "ask-skip": S.screen="rec"; render(); ptoast("Skipped. Nothing is saved; it asks again before the next Take."); return;
    case "close-lab": S.screen = S.take>1 ? "ideal" : "lounge"; if(S.take>1) S.take--; render(); return;
    case "finish-take": S.screen="ideal"; render(); return;
    case "next-take": beginTake(S.take+1); return;
    /* Data & consent */
    case "s-toggle": if(S.sensitive){ S.sConfirm=true; } else { S.sensitive=true; } render(); return;
    case "s-off": S.sConfirm=false; S.sensitive=false; render(); return;
    case "s-cancel": S.sConfirm=false; render(); return;
    case "t-toggle": if(S.training){ S.tConfirm=true; } else { S.training=true; } render(); return;
    case "t-off": S.tConfirm=false; S.training=false; render(); return;
    case "t-cancel": S.tConfirm=false; render(); return;
    case "del-open": S.delConfirm=true; render(); return;
    case "del-dismiss": S.delConfirm=false; render(); return;
    case "del-confirm": S.delConfirm=false; S.delCancelled=false; S.delPending=deletionDate(); render(); return;
    case "del-cancel": S.delPending=null; S.delCancelled=true; render(); return;
    case "menu": ptoast("The menu is not part of this prototype. Use the bar above."); return;
    case "footlink": ptoast("Footer links are not part of this prototype."); return;
  }
});
document.addEventListener("keydown", function(ev){
  if(ev.key!=="Escape") return;
  if(S.delConfirm){ S.delConfirm=false; render(); }
  else if(S.docOpen){ S.docOpen=null; render(); }
  else if(S.details){ S.details=false; render(); }
});

/* ------------------------------ chrome ------------------------------ */
function resetFirst(){ S.screen="welcome"; S.step=firstStep(); S.seen={}; S.country=null; S.age=false; S.sens=false; S.practiceTick=false; S.declined=false; S.saving=false; S.docOpen=null; S.details=false; S.take=1; }
function setMode(m){
  if(advanceTimer){clearTimeout(advanceTimer);advanceTimer=null;}
  S.mode = m; S.delConfirm=false; S.docOpen=null; S.details=false;
  if(m==="first"){ resetFirst(); }
  else if(m==="data"){ S.screen = "data"; }
  else { S.accepted = true; S.take = 1; S.screen = "lounge"; }
  render();
}
function setFlow(f){ S.flow=f; S.training=false; if(S.mode==="first"){ resetFirst(); S.screen="accept"; } setMode(S.mode); if(S.mode==="first"){ S.screen="accept"; render(); } }
function setDev(d){ S.dev=d; document.querySelectorAll("[data-dev]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-dev")===d));}); layout(); render(); }
document.querySelectorAll("[data-mode]").forEach(function(b){b.addEventListener("click",function(){setMode(b.getAttribute("data-mode"));});});
document.querySelectorAll("[data-flow]").forEach(function(b){b.addEventListener("click",function(){setFlow(b.getAttribute("data-flow"));});});
document.querySelectorAll("[data-dev]").forEach(function(b){b.addEventListener("click",function(){setDev(b.getAttribute("data-dev"));});});
document.getElementById("restart").addEventListener("click",function(){ var m=S.mode, f=S.flow; S=fresh(); S.flow=f; lastKey=""; setMode(m); });

function layout(){
  var wrap=document.getElementById("stagewrap"), r=wrap.getBoundingClientRect();
  var small = window.innerWidth<560 && S.dev!=="desk";
  proto.classList.toggle("full", small);
  device.classList.toggle("desk", S.dev==="desk");
  device.classList.toggle("short", S.dev==="small");
  device.classList.toggle("fullphone", small);
  if(small){ device.style.width=""; device.style.height=""; device.style.transform=""; requestAnimationFrame(measure); return; }
  var Wd = S.dev==="desk"?1180:(S.dev==="small"?375:390), H = S.dev==="desk"?820:(S.dev==="small"?667:844);
  device.style.width=Wd+"px"; device.style.height=H+"px";
  var sc=Math.min(1,(r.width-48)/Wd,(r.height-48)/H);
  device.style.transform="scale("+sc+")";
  requestAnimationFrame(measure);
}
window.addEventListener("resize",layout);
S = fresh(); layout(); render();
})();
</script>
